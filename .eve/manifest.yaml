# Eve Horizon Manifest (v2)
# This file defines your application's deployment configuration
# Learn more: https://github.com/Incept5/eve-horizon

schema: eve/compose/v2
project: eve-starter

# Default values applied across environments
x-eve:
  defaults:
    env: sandbox

registry: "eve"

# Environment definitions - where your application runs
# Deploy using: eve env deploy <env-name> --ref <git-sha-or-branch>
# Or via pipeline: eve pipeline run <pipeline-name> --env <env-name>
environments:
  sandbox:
    type: persistent

# Service definitions - the services that make up your application
services:
  db:
    x-eve:
      role: managed_db
      managed:
        class: db.p1
        engine: postgres
        engine_version: "16"

  migrate:
    image: public.ecr.aws/w7c4v0w3/eve-horizon/migrate:latest
    environment:
      DATABASE_URL: ${managed.db.url}
      MIGRATIONS_DIR: /migrations
    x-eve:
      role: job
      files:
        - source: db/migrations/
          target: /migrations

  api:
    build:
      context: apps/api
    ports: [3000]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${managed.db.url}
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
    x-eve:
      ingress:
        public: true
        port: 3000
      api_spec:
        spec_url: /openapi.json

pipelines:

  # Deploy sandbox environment pipeline
  # For direct deployment use: eve env deploy sandbox --ref <git-sha-or-branch>
  deploy-sandbox:
    steps:
      - name: build
        action:
          type: build
      - name: release
        depends_on: [build]
        action:
          type: release
      - name: deploy
        depends_on: [release]
        action:
          type: deploy
          env_name: sandbox
      - name: migrate
        depends_on: [deploy]
        action:
          type: run
          service: migrate
